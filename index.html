    <style>
      /* Pantalla de carga: se pinta antes de que React monte */
      #cm-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 90% at 50% 0%, #0b1a2e 0%, #04060b 62%),
          #04060b;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #cm-loader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .cm-loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
      }
      .cm-loader-inner img {
        width: 132px;
        height: auto;
        filter: drop-shadow(0 0 26px rgba(10, 132, 255, 0.45));
        animation: cmPop 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .cm-loader-bar {
        width: 190px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .cm-loader-bar span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #0a84ff, #6bb2ff, #d4af37);
        animation: cmBar 1.1s cubic-bezier(0.6, 0.05, 0.3, 1) infinite;
      }
      .cm-loader-text {
        font-family: Sora, system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.32em;
        color: rgba(214, 219, 228, 0.55);
        text-transform: uppercase;
      }
      @keyframes cmPop {
        from { opacity: 0; transform: translateY(14px) scale(0.94); }
        to { opacity: 1; transform: none; }
      }
      @keyframes cmBar {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .cm-loader-inner img, .cm-loader-bar span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="cm-loader" role="status" aria-label="Cargando Cell Max">
